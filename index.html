<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Chronos Earth — explore 250 million years of Earth and human history on an interactive 3D globe." />
    <!-- Rich link previews (Open Graph + Twitter). Every share is a first
         impression, so the card is a real orthographic globe from the app's own
         Natural Earth imagery (baked by scripts/build-og-image.mjs).
         NOTE: og:image and og:url MUST be ABSOLUTE — social scrapers do not
         resolve the app's relative `base: './'` paths — so these hard-code the
         GitHub Pages origin. If the site ever moves, update these three lines. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Chronos Earth" />
    <meta property="og:title" content="Chronos Earth — a living globe of 250 million years of history" />
    <meta property="og:description" content="Drag one timeline across 250 million years and watch the world change — continents drift, empires rise and fall, monuments rise, eclipses sweep the Earth. Free. No ads. No accounts." />
    <meta property="og:url" content="https://bunhead.github.io/chronos-earth/" />
    <meta property="og:image" content="https://bunhead.github.io/chronos-earth/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="An orthographic globe showing Africa, Europe and the Atlantic, beside the title Chronos Earth and the tagline 250 million years of history on one living globe." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Chronos Earth — a living globe of 250 million years of history" />
    <meta name="twitter:description" content="Drag one timeline across 250 million years and watch the world change. Free, no ads, no accounts." />
    <meta name="twitter:image" content="https://bunhead.github.io/chronos-earth/og-image.jpg" />
    <!-- The globe layers sharp Esri satellite tiles from this host the moment it
         mounts, so open the TCP/TLS connection early to shave the handshake off
         the first tiles. -->
    <link rel="preconnect" href="https://server.arcgisonline.com" crossorigin />
    <!-- Start the startup data downloading at HTML parse, in parallel with the
         JS — otherwise these fetches only begin after React mounts. The four
         biggest cold-start payloads; hrefs relative so the Pages subpath works. -->
    <!-- WHICH skeleton to warm depends on the tiling flag, so this one is
         chosen at parse time rather than hard-coded. The tiled path never reads
         core-index.json, and preloading a file nobody opens is a download every
         visitor pays for and nobody spends — the Captain caught it as three
         "preloaded but not used" warnings in the console. Mirrors
         lib/tilingFlag.ts; keep the two in step. -->
    <script>
      (function () {
        try {
          var q = new URLSearchParams(location.search).get("tiles");
          var tiled = q === "1" || q === "on"
            ? true
            : q === "0" || q === "off"
              ? false
              : localStorage.getItem("chronos.tiling") !== "off";
          var l = document.createElement("link");
          l.rel = "preload"; l.as = "fetch"; l.crossOrigin = "anonymous";
          l.href = tiled ? "./data/core-index/headline.json" : "./data/core-index.json";
          document.head.appendChild(l);
        } catch (e) { /* no storage — the app fetches it normally a moment later */ }
      })();
    </script>
    <link rel="preload" as="fetch" href="./data/battles.json" crossorigin />
    <!-- battle-views.json is NOT preloaded. It is 290 KB and rising — the
         choreographer routine added 2,635 lines to it in one week — and it is
         needed only when a visitor opens a battle, which most never do. It was
         costing every cold start on every machine for a file the majority never
         read. It still loads, just when it is wanted. -->
    <link rel="preload" as="fetch" href="./data/ancient-sites.json" crossorigin />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Chronos Earth</title>
  </head>
  <body>
    <div id="root">
      <!-- Static splash: shown instantly, replaced the moment the app mounts. -->
      <style>
        .boot-splash {
          position: fixed;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 14px;
          background: radial-gradient(ellipse at 50% 40%, #14202e 0%, #090d13 70%);
          color: #eaf3ff;
          font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .boot-splash h1 {
          margin: 0;
          font-size: 34px;
          letter-spacing: 2px;
          font-weight: 600;
        }
        .boot-splash p {
          margin: 0;
          font-size: 13px;
          color: #8ba3bf;
        }
        .boot-globe {
          width: 54px;
          height: 54px;
          border-radius: 50%;
          background: conic-gradient(from 0deg, #2c6aa0, #3f8e5a, #b98b46, #2c6aa0);
          box-shadow: 0 0 30px rgba(74, 163, 255, 0.35), inset -8px -8px 16px rgba(0, 0, 0, 0.5);
          animation: boot-spin 2.4s linear infinite;
        }
        @keyframes boot-spin {
          to { transform: rotate(360deg); }
        }
      </style>
      <div class="boot-splash">
        <div class="boot-globe"></div>
        <h1>Chronos Earth</h1>
        <p>Winding back 250 million years…</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
