# The AUTOMATED HARVESTER — grows the history dataset with no human (and no
# AI tokens) involved. Runs nightly, or on demand from the Actions tab ("Run
# workflow" button). It fetches new Wikidata events (additive union — it can
# only ADD, never lose), rebuilds the index, and commits; the commit then
# triggers the normal Pages deploy, so fresh data ships itself.
name: Harvest history data

on:
  schedule:
    - cron: '17 3 * * *' # nightly, 03:17 UTC (quiet hours for the query service)
  workflow_dispatch: # the "Run workflow" button — the Captain's one-click harvest

permissions:
  contents: write

concurrency:
  group: harvest
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    # THE BUDGET MUST FIT, AND IT DID NOT. This was 75 while the two fetch
    # steps below are capped at 55m + 25m = 80m — so whenever the first fetch
    # ran long (it always does; it exists to run until stopped) the JOB timeout
    # killed the run partway through the second, and every step after it,
    # INCLUDING THE COMMIT, was skipped. The nightly harvest ran for 75 minutes
    # a night from at least 12 Sept 2026 and threw the results away every time.
    #
    # Keep this greater than the sum of the inner timeouts plus headroom for
    # the index rebuild, the lint and the push:
    # REBALANCED 20 Sept 2026, after the harvest was repaired. The events
    # sweep used to need 55 minutes because every query failed six times over;
    # class-first it does the whole world in about three. The people sweep now
    # runs 32 queries (16 occupations x 2 sweeps) instead of 16, so the time
    # moves from one to the other rather than being added.
    #     25 (events) + 45 (people) + 15 (inventions/discoveries)
    #   + 20 (capitals) + 15 (pleiades) + 10 (video feeds) + 5 (video metadata)
    #   + 20 (rebuild, lint, commit) = 120, with headroom for WDQS having a
    # bad night:
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch new events from Wikidata (additive)
        # Cap the fetch itself — exit 124 is fine: the script writes after every
        # category, so whatever it gathered still gets committed below. The
        # Captain's first button-run was cancelled at the job timeout WITH data
        # in hand; never again. 25m is far more than the ~3 minutes the
        # class-first queries need, and exists for the nights WDQS is unwell.
        run: timeout 25m node scripts/fetch-wikidata-events.mjs || [ $? -eq 124 ]
      - name: Fetch notable people (documented + traditional)
        # This step did not exist until 2026-07-20, which is why every single
        # person in events.json was hand-added: the people harvest was written,
        # committed, and then never actually run. Same timeout treatment as
        # above — partial results are still worth keeping.
        run: timeout 45m node scripts/fetch-people.mjs || [ $? -eq 124 ]
      - name: Fetch inventions and discoveries (additive)
        if: '!cancelled()'
        # The categories nothing had ever queried. The box-based sweep above
        # CANNOT reach them — it needs coordinates on the item itself, and an
        # invention is not a place. This asks Wikidata for P575 (time of
        # discovery or invention) and takes the pin from the related place
        # instead. Two whole-graph queries of ~45 s, plus a chunked follow-up
        # that flags the country-level pins; ~5 minutes observed, 15m of room.
        # Same partial-results treatment as the fetches above.
        run: timeout 15m node scripts/fetch-discoveries.mjs || [ $? -eq 124 ]
      - name: Ancient places from Pleiades (additive)
        if: '!cancelled()'
        # The standing gazetteer of the ancient world, NYU's ISAW, CC-BY 3.0,
        # republished as a CSV dump every morning. No key, no quota.
        #
        # It is a Greco-Roman gazetteer — 78% Mediterranean — so it does NOT
        # fill Asia or Africa and should not be expected to. What it fills is
        # TIME: 17,479 of the rows it contributed begin BCE, at a point in the
        # timeline where the globe was nearly empty everywhere.
        run: timeout 15m node scripts/fetch-pleiades.mjs || [ $? -eq 124 ]
      - name: Follow the video channels (suggest only, never publishes)
        if: '!cancelled()'
        # Keyless: every YouTube channel publishes a plain Atom feed at
        # /feeds/videos.xml?channel_id=UC… with its last 15 uploads. No API key,
        # no account, so it costs nothing to run.
        #
        # It writes to the "suggested" list in videos.json and NOTHING ELSE. A
        # pin needs a place and a reason and no script should invent either, so
        # a human waves each one through. The unmatched pile is the valuable
        # half: on the first run, 12 of 14 named Scottish battles the globe does
        # not have, which is an audit of the gaps as much as a video feed.
        # The key is handed to THIS STEP ONLY. It is a repository secret, so it
        # never exists in the repo, never reaches the built site, and is not
        # available to a workflow triggered from a fork. Without it the step
        # still runs, on the public Atom feed.
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: timeout 10m node scripts/fetch-video-feeds.mjs || [ $? -eq 124 ]
      - name: Refresh the curated video metadata (idempotent)
        if: '!cancelled()'
        # Re-reads title/channel/thumbnail from YouTube's keyless oEmbed, so a
        # renamed video cannot go stale on the globe. Also exits 1 if a video
        # cross-references an event id that does not exist.
        run: timeout 5m node scripts/add-videos.mjs || [ $? -eq 124 ]
      - name: Add the curated great disasters (idempotent)
        # From here down, run even if a fetch step above failed outright: a
        # crash in the people harvest must not throw away the events harvest.
        # ("!cancelled()" still stops on a genuine job cancellation.)
        if: '!cancelled()'
        # Pandemics have no coordinates, so the box-based harvest above can
        # never find them however the query is widened. These arrive by hand.
        run: node scripts/add-disasters.mjs
      - name: Add the curated legends (idempotent)
        if: '!cancelled()'
        # Hand-written figures who defeat any query — no birthplace, no usable
        # date. Re-run each night so edits to the file take effect.
        run: node scripts/add-legends.mjs
      - name: Add the candidates for the first city (idempotent)
        if: '!cancelled()'
        # Uruk, Eridu, Harappa and the rest. Real coordinates, so the harvest
        # COULD reach them — it just never swept those cells deeply enough.
        # Re-run nightly so edits to the file take effect, and so a later sweep
        # that does find them dedups instead of duplicating.
        run: node scripts/add-first-cities.mjs
      - name: Guarantee every country's capital (idempotent)
        if: '!cancelled()'
        # Madrid is typed only as "municipality of Spain", so no class-first
        # city query can ever reach it — nor any capital an editor filed as a
        # district or a governorate. This asks what a place DOES rather than
        # what it IS. Cheap (~200 rows) and it is the one thing a history globe
        # must not get wrong.
        run: node scripts/add-capitals.mjs
      - name: Add the places the Captain asked for by name (idempotent)
        if: '!cancelled()'
        # Roden Crater and the like: too few sitelinks for any query to reach,
        # and no "founded" date to find. Re-run nightly so edits take effect.
        run: node scripts/add-curated-places.mjs
      - name: Add the capitals no query can date (idempotent)
        if: '!cancelled()'
        # Ten capitals, Beijing among them, that Wikidata records no date for at
        # all. Dated by hand from the English Wikipedia infobox or lead, with the
        # quote kept in dateNote. Nine more are deliberately still missing: there
        # was nothing to cite. See the script header before adding any.
        run: node scripts/add-curated-capitals.mjs
      - name: Mark which cities were capitals, and when
        if: '!cancelled()'
        # Attaches capitalOf to city rows already on the globe; never creates a
        # row. Two queries on purpose — the truthy P1376 is indexed and cheap,
        # the statement walk with its date qualifiers is only affordable with
        # the subjects supplied in chunks. A third pass keeps only COUNTRY-level
        # roles, so a state or county seat is not painted as a capital.
        #
        # Runs AFTER the city harvest AND after add-capitals / add-curated-
        # capitals. It used to run before those two, so a capital they added
        # stayed blue until the following night. 40 minutes, not 20: the
        # country check is an extra pass, and when WDQS is struggling a pass
        # that times out writes nothing — by design, never half a layer.
        run: timeout 40m node scripts/fetch-capitals.mjs || [ $? -eq 124 ]
      - name: Merge places pinned twice (idempotent)
        if: '!cancelled()'
        # Each harvester dedupes against what it can see, and they see different
        # things: the Pleiades import guards spatially, the city sweep guards by
        # wiki title, which a Pleiades row has not got. So arrival order decided
        # it and Pompeii, Ostia, Cyrene and Frankfurt each got a second pin. This
        # merges only where the sources agree, and leaves date disagreements for
        # the Captain. MUST run before the index is built from it.
        run: node scripts/dedupe-places.mjs
      - name: Tell apart different things that share a label (idempotent)
        if: '!cancelled()'
        # Two battles of Canton in 1841, two of Thessalonica in 1040, Lexington
        # in Kentucky and in North Carolina: identical labels, different
        # articles. Each takes its article title so they stop looking doubled.
        run: node scripts/disambiguate-names.mjs
      - name: Rebuild the core index
        if: '!cancelled()'
        run: node scripts/build-core-index.mjs
      - name: Lint the data (report only — never lose a night's harvest)
        if: '!cancelled()'
        # Warn-only: surfaces bad ids/coords/dates/categories in the log without
        # discarding the whole additive harvest over one bad row. Run `npm run
        # lint:data` locally (no --warn) to fail hard when cleaning up.
        run: node scripts/lint-data.mjs --warn
      - name: Commit & push if the dataset grew
        if: '!cancelled()'
        # CONFLICT-TOLERANT ON PURPOSE. This step used to be a bare
        # `git pull --rebase` + `git push`, and on 18 Sept 2026 somebody pushed
        # to public/data while the harvest was running: the rebase stopped on a
        # conflict in generated JSON, the step failed, and the ENTIRE NIGHT'S
        # CATCH was thrown away. The harvest runs for over an hour, so that
        # window is wide, and four scheduled sweeps share this repo.
        #
        # It was never a real conflict. events.json is an additive union keyed
        # by row id — two writers adding different events both belong — and
        # everything else under public/data is DERIVED from it, so the right
        # answer there is not to merge at all but to rebuild. That is exactly
        # what happens below. resolve-data-conflicts.mjs refuses anything
        # outside public/data, so a genuine code conflict still stops the run.
        run: |
          set -u
          git config user.name "chronos-harvester"
          git config user.email "actions@users.noreply.github.com"
          # ONLY public/data is ever committed, so nothing else may be left
          # dirty: `git pull --rebase` refuses to run over unstaged changes,
          # and on 24 Sept 2026 that is exactly what threw away a night that
          # had recovered 847 cities. fetch-capitals updates its polity cache
          # (scripts/data/polity-class.json) as it goes; that cache is only a
          # speed-up, the committed copy is kept current by the one-off
          # re-check workflow, so the runner's copy is simply discarded.
          git checkout -- scripts/data 2>/dev/null || true
          git add public/data
          if git diff --cached --quiet; then
            echo "No new events this run."
            exit 0
          fi
          git commit -m "Data: automated nightly harvest (additive)"

          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin main; then
              if git push; then
                echo "Harvest landed cleanly on attempt $attempt."
                exit 0
              fi
              echo "Push rejected — the branch moved again. Retrying."
              continue
            fi

            echo "Rebase hit conflicts on attempt $attempt — resolving additively."
            if ! node scripts/resolve-data-conflicts.mjs; then
              echo "Not an additive-data conflict; this needs a human." >&2
              git rebase --abort || true
              exit 1
            fi
            git add public/data
            if ! GIT_EDITOR=true git rebase --continue; then
              echo "Rebase still stuck after resolution." >&2
              git rebase --abort || true
              exit 1
            fi
            # The derived files were taken from one side to clear the conflict.
            # Rebuild them from the merged source before anything ships, or the
            # index would disagree with the events it is built from.
            # An additive union can bring back a row another writer merged
            # away, so dedupe again before rebuilding from it.
            node scripts/dedupe-places.mjs
            node scripts/disambiguate-names.mjs
            node scripts/build-core-index.mjs
            git add public/data
            git diff --cached --quiet || git commit -m "Data: rebuild index after additive merge"
            if git push; then
              echo "Harvest landed after an additive merge, attempt $attempt."
              exit 0
            fi
            echo "Push rejected after the merge — retrying."
          done

          echo "Could not land the harvest after 3 attempts." >&2
          exit 1
